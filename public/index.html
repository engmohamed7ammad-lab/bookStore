<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookStore - Login</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>BookStore</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button type="submit">
                    Login
                </button>

                <p id="message"></p>

            </form>

            <p class="switch-page">

                Don't have an account?

                <a href="/register.html">
                    Create one
                </a>

            </p>

        </div>

    </div>

    <script src="/js/login.js"></script>

</body>

</html>
