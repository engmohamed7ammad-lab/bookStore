<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BookStore - Dashboard</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <!-- ================= DASHBOARD ================= -->

    <div class="dashboard-container">


        <!-- ================= HEADER ================= -->

        <header class="dashboard-header">

            <div>

                <h1>BookStore</h1>

                <p>Welcome to your dashboard</p>

            </div>


            <button id="logoutBtn">
                Logout
            </button>

        </header>


        <!-- ================= USER INFO ================= -->

        <section class="user-info">

            <h2>
                Welcome,
                <span id="userName"></span>
                👋
            </h2>

            <p>
                Email:
                <strong id="userEmail"></strong>
            </p>

            <p>
                Role:
                <strong id="userRole"></strong>
            </p>

        </section>


        <!-- ================= ADMIN PANEL ================= -->

        <section
            id="adminPanel"
            class="admin-panel"
        >

            <div class="admin-header">

                <div>

                    <h2>Admin Panel</h2>

                    <p>
                        Manage your bookstore
                    </p>

                </div>


                <button id="addBookBtn">
                    + Add Book
                </button>

            </div>

        </section>


        <!-- ================= USERS ================= -->

        <section
            id="usersSection"
            class="users-section"
        >

            <div class="users-header">

                <div>

                    <h2>Users</h2>

                    <p>
                        Manage bookstore users
                    </p>

                </div>


                <button id="refreshUsersBtn">
                    Refresh
                </button>

            </div>


            <div id="usersContainer">
                Loading users...
            </div>

        </section>


        <!-- ================= BOOKS ================= -->

        <section class="books-section">

            <h2>Books</h2>

            <div id="booksContainer">
                Loading books...
            </div>

        </section>

    </div>


    <!-- ================================================= -->
    <!-- ================= BOOK MODAL ==================== -->
    <!-- ================================================= -->

    <div
        id="bookModal"
        class="modal"
    >

        <div class="modal-content">


            <div class="modal-header">

                <h3 id="modalTitle">
                    Add New Book
                </h3>


                <button
                    type="button"
                    id="closeModalBtn"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <form id="bookForm">


                <div class="form-group">

                    <label for="bookTitle">
                        Title
                    </label>

                    <input
                        type="text"
                        id="bookTitle"
                        placeholder="Enter book title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="bookPrice">
                        Price
                    </label>

                    <input
                        type="number"
                        id="bookPrice"
                        placeholder="Enter book price"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="bookAuthor">
                        Author
                    </label>

                    <input
                        type="text"
                        id="bookAuthor"
                        placeholder="Enter author name"
                        required
                    >

                </div>


                <div class="modal-actions">

                    <button type="submit">
                        Save Book
                    </button>

                    <button
                        type="button"
                        id="cancelBookBtn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                </div>


                <p id="bookMessage"></p>

            </form>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- ================= DELETE MODAL ================== -->
    <!-- ================================================= -->

    <div
        id="deleteModal"
        class="modal"
    >

        <div class="modal-content delete-modal">


            <div class="modal-header">

                <h3>
                    Delete Book
                </h3>


                <button
                    type="button"
                    id="closeDeleteModalBtn"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <p class="delete-message">

                Are you sure you want to
                delete this book?

            </p>


            <div class="modal-actions">

                <button
                    type="button"
                    id="confirmDeleteBtn"
                    class="delete-confirm-btn"
                >
                    Delete
                </button>


                <button
                    type="button"
                    id="cancelDeleteBtn"
                    class="cancel-btn"
                >
                    Cancel
                </button>

            </div>


            <p id="deleteMessage"></p>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- ================= JAVASCRIPT ==================== -->
    <!-- ================================================= -->

    <script src="/js/dashboard.js"></script>

</body>

</html>
